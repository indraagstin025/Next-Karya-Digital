name: Build frontend image

# Dijalankan saat push ke main atau manual dari tab Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nama image sengaja ditulis lengkap dan huruf kecil. Jika repo dipindah
      # ke owner lain, ubah di sini dan di docker-compose.prod.yml.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://nextkarya.web.id/api/v1' }}
            BACKEND_API_URL=${{ vars.BACKEND_API_URL || 'http://backend:5000/api/v1' }}
            NEXT_PUBLIC_MEDIA_HOST=${{ vars.NEXT_PUBLIC_MEDIA_HOST }}
          tags: |
            ghcr.io/indraagstin025/next-karya-frontend:latest
            ghcr.io/indraagstin025/next-karya-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
